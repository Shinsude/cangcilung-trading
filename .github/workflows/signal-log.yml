name: Signal log (riwayat sinyal nyata)

on:
  schedule:
    # Setelah cron retrain (21:00) & fallback (22:00) selesai, catat sinyal harian
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Append sinyal harian ke logs
        run: python3 .github/scripts/append_signal_log.py

      - name: Forward-test 60m (paper, harian)
        run: |
          pip install --quiet --disable-pip-version-check yfinance pandas numpy
          python3 .github/scripts/run_forward_test.py

      - name: Commit jika ada perubahan
        run: |
          git config --local user.name "cangcilung-bot"
          git config --local user.email "cangcilung-bot@users.noreply.github.com"
          git add flutter_app/web/signals_log.json research/forward_test_log.csv
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan log"
            exit 0
          fi
          git commit -m "log: sinyal harian + forward-test 60m $(date -u +%Y-%m-%d)"
          git push origin HEAD:main