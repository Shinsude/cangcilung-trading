name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold platform folders
        working-directory: flutter_app
        run: |
          flutter create --platforms=android,ios --org com.cangcilung --project-name cangcilung_trading .
          flutter config --no-analytics

      - name: Add permissions for release (INTERNET + notifications)
        working-directory: flutter_app
        run: |
          python3 - <<'PY'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          perms = ["android.permission.INTERNET", "android.permission.POST_NOTIFICATIONS"]
          for p in perms:
              if p not in content:
                  content = content.replace(
                      "<application",
                      f'<uses-permission android:name="{p}"/>\n    <application',
                      1,
                  )
          with open(path, "w") as f:
              f.write(content)
          print("manifest patched")
          PY
          cat android/app/src/main/AndroidManifest.xml | head -10

      - name: Configure Firebase (google-services.json + plugin)
        working-directory: flutter_app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import os, pathlib

          raw = os.environ.get("GOOGLE_SERVICES_JSON", "")
          has_secret = bool(raw and raw.strip())
          app_dir = pathlib.Path("android/app")

          if not has_secret:
              print("No GOOGLE_SERVICES_JSON secret; Firebase push OFF")
              raise SystemExit(0)

          # Sudah punya secret -> tulis json + tambahkan plugin google-services
          app_dir.mkdir(parents=True, exist_ok=True)
          (app_dir / "google-services.json").write_text(raw)
          print("googleservices: json written")

          # settings.gradle(.kts): daftarkan plugin
          for fname in ("android/settings.gradle.kts", "android/settings.gradle"):
              p = pathlib.Path(fname)
              if not p.exists():
                  continue
              s = p.read_text()
              if "com.google.gms.google-services" not in s:
                  if "plugins {" in s:
                      s = s.replace("plugins {", 'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false', 1)
                  elif "pluginManagement {" in s:
                      s += '\npluginManagement { plugins { id("com.google.gms.google-services") version "4.4.2" } }\n'
                  else:
                      s += "\nbuildscript { dependencies { classpath 'com.google.gms:google-services:4.4.2' } }\n"
                  p.write_text(s)
                  print("settings: plugin added ->", fname)

          # build.gradle(.kts) project level: classpath untuk groovy style
          proj = pathlib.Path("android/build.gradle")
          if proj.exists():
              s = proj.read_text()
              if "com.google.gms:google-services" not in s and "com.google.gms.google-services" not in s:
                  s = s.replace("dependencies {", "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'", 1)
                  proj.write_text(s)
                  print("project build.gradle: classpath added")

          # app build.gradle(.kts): apply plugin
          app_kt = pathlib.Path("android/app/build.gradle.kts")
          if app_kt.exists():
              s = app_kt.read_text()
              if 'id("com.google.gms.google-services")' not in s:
                  if "plugins {" in s:
                      s = s.replace("plugins {", 'plugins {\n    id("com.google.gms.google-services")', 1)
                  else:
                      s += '\napply(plugin = "com.google.gms.google-services")\n'
              app_kt.write_text(s)
              print("app build.gradle.kts: plugin applied")
          else:
              app = pathlib.Path("android/app/build.gradle")
              if app.exists():
                  s = app.read_text()
                  if "com.google.gms.google-services" not in s:
                      s = s.replace("apply plugin: 'kotlin-android'", "apply plugin: 'kotlin-android'\napply plugin: 'com.google.gms.google-services'")
                      s = s.replace('apply plugin: "kotlin-android"', 'apply plugin: "kotlin-android"\napply plugin: "com.google.gms.google-services"')
                  app.write_text(s)
                  print("app build.gradle: applied")
          PY
          ls -la android/app/google-services.json 2>/dev/null || echo "(no google-services.json secret set)"

      - name: Enable core library desugaring for flutter_local_notifications
        working-directory: flutter_app
        run: |
          python3 - <<'PY'
          import os, re
          py = "android/app/build.gradle.kts"
          if not os.path.exists(py):
              py = "android/app/build.gradle"
          with open(py) as f:
              s = f.read()
          changed = False
          if "isCoreLibraryDesugaringEnabled" not in s:
              if "compileOptions {" in s:
                  s = s.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
              else:
                  s = s.replace("android {", "android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }", 1)
              changed = True
          if "desugar_jdk_libs" not in s:
              s = s.rstrip() + "\n\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n"
              changed = True
          with open(py, "w") as f:
              f.write(s)
          print("gradle patched" if changed else "gradle already ok")
          PY
          cat android/app/build.gradle.kts 2>/dev/null | sed -n '1,8p'

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cangcilung-trading-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-aab:
    runs-on: ubuntu-latest
    needs: build-apk
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold platform folders
        working-directory: flutter_app
        run: |
          flutter create --platforms=android --org com.cangcilung --project-name cangcilung_trading .
          flutter config --no-analytics

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build App Bundle (AAB)
        working-directory: flutter_app
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: cangcilung-trading-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold platform folders (include web)
        working-directory: flutter_app
        run: |
          flutter create --platforms=web --org com.cangcilung --project-name cangcilung_trading .
          flutter config --no-analytics

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Patch index.html with splash screen
        working-directory: flutter_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("web/index.html")
          html = p.read_text()

          if 'id="splash"' not in html:
              splash = '''<div id="splash" style="position:fixed;inset:0;background:#0A0E17;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#F8FAFC;font-family:Arial,sans-serif">
              <div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#00E68A,#3B82F6);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff">C</div>
              <div style="margin-top:16px;font-size:20px;font-weight:800;letter-spacing:-0.3px">Cangcilung</div>
              <div style="font-size:9px;font-weight:700;letter-spacing:2.5px;color:#64748B;margin-top:2px">TRADING AI</div>
              <div style="margin-top:24px;width:24px;height:24px;border-radius:50%;border:3px solid #1E293B;border-top-color:#00E68A;animation:splashspin .9s linear infinite"></div>
              <div style="margin-top:14px;font-size:12px;color:#64748B">Memuat data pasar\u2026</div>
              </div>
              <style>@keyframes splashspin{to{transform:rotate(360deg)}}</style>'''
              html = html.replace("<body>", "<body>\n" + splash, 1)
              hide_script = '''<script>
              window.addEventListener('flutter-first-frame',function(){var s=document.getElementById('splash');if(s){s.style.transition='opacity .4s ease';s.style.opacity='0';setTimeout(function(){s.remove()},500);}});
              setTimeout(function(){var s=document.getElementById('splash');if(s){s.style.transition='opacity .4s ease';s.style.opacity='0';setTimeout(function(){s.remove()},500);}},20000);
              </script>'''
              html = html.replace("</body>", hide_script + "\n</body>", 1)
              p.write_text(html)
          print("splash patched")
          PY

      - name: Build Web
        working-directory: flutter_app
        run: flutter build web --release --base-href /cangcilung-trading/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_app/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4