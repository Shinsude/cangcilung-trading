name: Refresh real signals log

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signals-log
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live signals & update log
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, subprocess, sys

          API = "https://cangcilung-trading-api.vercel.app/signal"
          SYMBOLS = ["XAUUSD", "NASDAQ", "AUDUSD"]
          LOG = "flutter_app/web/signals_log.json"
          today = datetime.date.today().isoformat()

          with open(LOG, encoding="utf-8") as f:
              entries = json.load(f)
          existing = {(e.get("date"), e.get("symbol")) for e in entries}
          added = 0

          for sym in SYMBOLS:
              try:
                  with urllib.request.urlopen(f"{API}/{sym}", timeout=120) as r:
                      d = json.loads(r.read().decode("utf-8"))
              except Exception as e:
                  print(f"[skip] {sym}: fetch error {e}")
                  continue
              if (d.get("data_source") or "").lower() != "live":
                  print(f"[skip] {sym}: data_source={d.get('data_source')} (bukan live)")
                  continue
              if (today, sym) in existing:
                  print(f"[skip] {sym}: sudah ada utk {today}")
                  continue
              sig = d.get("signal") or {}
              entries.append({
                  "date": today,
                  "symbol": sym,
                  "action": sig.get("action"),
                  "strength": sig.get("strength"),
                  "score": sig.get("score"),
                  "close": d.get("current_price"),
              })
              added += 1
              print(f"[log] {sym}: {sig.get('action')} {sig.get('strength')} score={sig.get('score')} close={d.get('current_price')}")

          if added == 0:
              print("tidak ada entri baru -> skip commit")
              sys.exit(0)

          entries.sort(key=lambda e: (e["date"], e["symbol"]))
          with open(LOG, "w", encoding="utf-8") as f:
              json.dump(entries, f, indent=1, ensure_ascii=False)
              f.write("\n")

          subprocess.run(["git", "config", "user.name", "Shinsude"], check=True)
          subprocess.run(["git", "config", "user.email", "165512522+Shinsude@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", LOG], check=True)
          subprocess.run(["git", "commit", "-m", f"log: sinyal real {today} ({added} simbol)"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          print(f"committed {added} entri")
          PY