name: Daily push notifikasi sinyal

on:
  schedule:
    # 23:30 UTC — setelah signal-log (23:00) selesai commit
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger /warm + push via backend
        run: |
          API="${{ secrets.API_BASE_URL || 'https://cangcilung-trading-api.vercel.app' }}"
          echo "Panggil /warm..."
          curl -s "${API}/warm" || true

      - name: Kirim push notifikasi via Firebase (opsional)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          API_BASE: ${{ secrets.API_BASE_URL || 'https://cangcilung-trading-api.vercel.app' }}
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: |
          echo "Sending push via backend /push/send..."
          # Kirim push ringkasan harian untuk semua simbol
          for SYM in XAUUSD NASDAQ AUDUSD; do
            RESP=$(curl -s "${API_BASE}/signal/${SYM}" 2>/dev/null || true)
            ACTION=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('signal',{}).get('action',''))" 2>/dev/null || true)
            CONF=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('signal',{}).get('confidence',0))" 2>/dev/null || echo "0")
            if [ "$ACTION" = "BUY" ] || [ "$ACTION" = "SELL" ]; then
              HAS_HIGH=$(echo "$CONF" | python3 -c "import sys; print('yes' if float(sys.stdin.read().strip())>=0.6 else 'no')" 2>/dev/null || echo "no")
              if [ "$HAS_HIGH" = "yes" ]; then
                curl -s "${API_BASE}/push/send?symbol=${SYM}" || true
                echo "push sent: ${SYM}"
              fi
            fi
          done
          echo "Done."
